<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>

  <div class="card" id="card" style="text-align: center;">
    <h1>Dashboard</h1>
    <p class="sub" id="welcome-msg">Loading...</p>

    <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 12px;">
      <button id="btn-setup-2fa" class="btn">Enable 2FA</button>
      <button id="btn-logout" class="btn" style="background: linear-gradient(135deg, #fb7185, #fecdd3); box-shadow: 0 6px 0 #9f1239;">Log Out</button>
    </div>

    <div id="2fa-setup" style="display: none; margin-top: 20px;">
      <p style="font-size: 14px; margin-bottom: 10px;">Scan with Google Authenticator:</p>
      <img id="qr-image" class="qr" src="" alt="QR Code">
      <input type="text" id="2fa-code" placeholder="6-digit code" maxlength="6" style="width: 100%; text-align: center; margin-bottom: 10px;">
      <button id="btn-verify-2fa" class="btn">Verify & Enable</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
