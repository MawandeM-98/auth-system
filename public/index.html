<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth System</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>

  <div class="card" id="card">
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="subtitle">Log in to your account</p>

    <div class="tabs" id="tabs">
      <button class="active" data-target="login">Login</button>
      <button data-target="register">Register</button>
      <button data-target="forgot">Forgot</button>
    </div>

    <!-- Login Form -->
    <form id="form-login" class="active">
      <input type="email" id="login-email" placeholder="Email address" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit" class="btn">Log In</button>
    </form>

    <!-- Register Form -->
    <form id="form-register">
      <input type="text" id="reg-name" placeholder="Full name" required>
      <input type="email" id="reg-email" placeholder="Email address" required>
      <input type="password" id="reg-password" placeholder="Password (min 8 chars)" required>
      <button type="submit" class="btn">Create Account</button>
    </form>

    <!-- Forgot Form -->
    <form id="form-forgot">
      <input type="email" id="forgot-email" placeholder="Email address" required>
      <button type="submit" class="btn">Send Reset Link</button>
    </form>

    <!-- 2FA Form (Hidden by default) -->
    <form id="form-2fa">
      <p style="text-align:center; margin-bottom: 10px; font-size: 14px;">Enter the 6-digit code from your authenticator app.</p>
      <div class="otp">
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
      </div>
      <button type="submit" class="btn" style="margin-top: 16px;">Verify Code</button>
    </form>

    <div class="msg" id="msg"></div>

    <div id="oauth-section">
      <div class="divider">OR CONTINUE WITH</div>
      <div class="oauth">
        <a href="/api/auth/google">Google</a>
        <a href="/api/auth/github">GitHub</a>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
